  else if (id === 'shame') { for (let i = 0; i < 6; i++) tone(1750 + (i % 3) * 140, 0.4, 'sine', 0.03, i * 0.25); sfx.laugh(0.08); }
  else if (id === 'ghost') noiseBurst(5, 0.05, 0, 500);
  else for (let i = 0; i < 6; i++) tone(1750 + (i % 3) * 140, 0.45, 'sine', 0.025, 1 + i * 0.3);
}
function finishEpilogue() { if (!EP.on) return; EP.on = false; showOverlay(EP.html); }
function drawEpilogue() {
  const c = ctx, t = EP.t, id = EP.id, gy = 505;
  const dn = id === 'grace' ? t / EP_DUR : id === 'edge' ? 0.5 + 0.45 * t / EP_DUR : id === 'shame' ? 0.15 + 0.3 * t / EP_DUR : 0.12;
  const mix = (a, b) => Math.round(a + (b - a) * dn);
  const sky = c.createLinearGradient(0, 0, 0, H);
  sky.addColorStop(0, 'rgb(' + mix(5, 70) + ',' + mix(3, 60) + ',' + mix(10, 120) + ')');
  sky.addColorStop(1, 'rgb(' + mix(29, 255) + ',' + mix(17, 170) + ',' + mix(40, 110) + ')');
  c.fillStyle = sky; c.fillRect(0, 0, W, H);
  const sg = c.createRadialGradient(480, 440, 0, 480, 440, 380); sg.addColorStop(0, 'rgba(255,200,120,' + dn * 0.7 + ')'); sg.addColorStop(1, 'rgba(255,200,120,0)');
  c.fillStyle = sg; c.fillRect(0, 0, W, H);
  c.fillStyle = '#07040c';
  for (let i = 0; i < 24; i++) { const x = i * 42, h = 100 + (i * 37) % 70; c.beginPath(); c.moveTo(x - 30, 440); c.lineTo(x, 440 - h); c.lineTo(x + 30, 440); c.fill(); }
  c.fillStyle = '#0d0912'; c.fillRect(0, 440, W, 160); c.fillStyle = '#050308'; c.fillRect(0, 520, W, 80);
  const open = id === 'edge' ? (t < 5 ? 1 : 1 - Math.min(1, (t - 5) / 0.7)) : Math.min(1, t / 2.5);
  c.fillStyle = '#1a1420'; c.fillRect(350, 310, 16, 190); c.fillRect(594, 310, 16, 190);
  c.strokeStyle = '#2a2230'; c.lineWidth = 4;
  const dw = 114 * (1 - open * 0.85);
  for (const side of [0, 1]) for (let i = 0; i <= 8; i++) { const x = side ? 594 - (i / 8) * dw : 366 + (i / 8) * dw; c.beginPath(); c.moveTo(x, 330); c.lineTo(x, 500); c.stroke(); }
  c.fillStyle = '#2a2230'; c.fillRect(366, 350, dw, 4); c.fillRect(594 - dw, 350, dw, 4);
  const jest = x => drawJester({ x, y: gy, state: 'wander', anim: t, look: 0 });
  if (id === 'grace') {
    drawPlayer(120 + Math.min(t, 3.5) * 165, gy, 0, t, t < 3.5);
    if (t > 3.8 && t < 7) GOAL.forEach((key, i) => drawIcon(key, 600 + i * 30, gy - 16, 26, true));
    if (t > 4 && t < 7.6) jest(470 + clamp((t - 4) / 3, 0, 1) * 100);
  } else {
    const px = id === 'edge' ? 100 + Math.min(t, 7) * 90 : 100 + Math.min(t, 9) * 65;
    drawPlayer(px, gy, 0, t, true);
    if (id === 'run' && t > 2) jest(300);
    if (id === 'ghost' && t > 5) { c.globalAlpha = Math.min(0.6, (t - 5) * 0.3); jest(230); c.globalAlpha = 1; }
    if (id === 'shame') jest(px - 130 + Math.sin(t * 3) * 8);
    if (id === 'edge' && t > 5.8 && t < 7.2) { c.globalAlpha = 0.35; drawFace(300, 300, 90, true, t * 6); c.globalAlpha = 1; }
  }
  if (id === 'grace' && t > 7.6) {
    const a = Math.min(1, (t - 7.6) / 0.8), fy = 270;
    c.fillStyle = 'rgba(8,4,12,' + a * 0.92 + ')'; c.fillRect(0, 0, W, H); c.globalAlpha = a;
    c.fillStyle = '#d9b08c'; c.beginPath(); c.ellipse(480, fy, 105, 130, 0, 0, 7); c.fill();
    c.fillStyle = '#2b1b12'; c.beginPath(); c.ellipse(480, fy - 95, 108, 60, 0, Math.PI, 0); c.fill();
    c.fillStyle = '#3a2a20'; c.beginPath(); c.arc(440, fy - 15, 8, 0, 7); c.arc(520, fy - 15, 8, 0, 7); c.fill();
    c.strokeStyle = '#8a4a3a'; c.lineWidth = 5; c.beginPath(); c.arc(480, fy + 35, 45, 0.15 * Math.PI, 0.85 * Math.PI); c.stroke();
    c.strokeStyle = 'rgba(150,70,60,.5)'; c.lineWidth = 3; c.beginPath(); c.moveTo(530, fy - 60); c.lineTo(500, fy + 20); c.stroke();
    c.fillStyle = 'rgba(150,200,255,.7)'; c.beginPath(); c.ellipse(440, fy + 10 + (t * 30) % 40, 3, 6, 0, 0, 7); c.fill();
    const my = 100 + Math.pow(t - 7.6, 2) * 60; if (my < 640) drawFace(200, my, 45, false, t);
    c.globalAlpha = 1;
  }
  const lines = EP_CAPS[id], L = (EP_DUR - 1) / lines.length;
  lines.forEach((s2, i) => { const a = i * L + 0.6, b = (i + 1) * L + 0.4; if (t > a && t < b) {
    c.globalAlpha = Math.min(1, (t - a) * 2, (b - t) * 2); c.fillStyle = 'rgba(0,0,0,.75)'; c.fillRect(0, 548, W, 52);
    c.fillStyle = '#e9e1d3'; c.font = 'italic 22px Georgia,serif'; c.textAlign = 'center'; c.fillText(s2, W / 2, 581); c.textAlign = 'left'; c.globalAlpha = 1;
  } });
  c.fillStyle = 'rgba(0,0,0,' + Math.max(0, 1 - t / 0.8, t - (EP_DUR - 1)) + ')'; c.fillRect(0, 0, W, H);
  c.fillStyle = '#9a8c96'; c.font = '13px system-ui,sans-serif'; c.textAlign = 'right'; c.fillText('Пробел или клик: пропустить', W - 14, 24); c.textAlign = 'left';
}
function showNotes() {
  G.state = 'menu';
  showOverlay('<h2>Архив записок: ' + SET.notes + ' / ' + NOTES.length + '</h2>' +
    '<p class="muted">Концовки: ' + ENDS.map(e => SET.ends[e[0]] ? e[1] : '???').join(' · ') + '</p>' +
    (SET.notes ? NOTES.slice(0, SET.notes).map(n => '<p><b>' + n[0] + '</b><br><i style="color:#d9cfe0">' + n[1] + '</i></p>').join('') : '<p class="muted">Пока пусто. Обыскивай дома, записки лежат среди вещей.</p>') +
    '<div class="btns"><button class="btn" data-act="menu">Назад</button></div>');
}
function showPause() {
  G.state = 'pause';
  showOverlay('<h2>Пауза</h2>' + togglesHtml() +
    '<div class="btns"><button class="btn" data-act="resume">Продолжить</button>' +
    '<button class="btn ghost" data-act="menu">В меню</button></div>' + HOWTO);
}
function togglePause() {
  if (G.state === 'play') showPause();
  else if (G.state === 'pause') { G.state = 'play'; hideOverlay(); }
}
function toggleSound() { setSound(!SET.sound); refreshBar(); if (G.state === 'pause') showPause(); else if (G.state === 'menu') showMenu(); }
function refreshBar() {
  const b = document.querySelector('[data-bar="sound"]');
  if (b) b.textContent = SET.sound ? '🔊 Звук: вкл' : '🔇 Звук: выкл';
}
function toggleFull() {
  const el = document.documentElement;
  if (!document.fullscreenElement) { if (el.requestFullscreen) el.requestFullscreen(); }
  else if (document.exitFullscreen) document.exitFullscreen();
}

ov.addEventListener('click', e => {
  const b = e.target.closest('[data-act],[data-diff],[data-toggle]');
  if (!b) return;
  initAudio();
  if (b.dataset.diff) { SET.diff = b.dataset.diff; saveSet(); if (G.state === 'menu') showMenu(); return; }
  if (b.dataset.toggle) {
    const key = b.dataset.toggle;
    if (key === 'sound') setSound(!SET.sound); else { SET[key] = !SET[key]; saveSet(); }
    refreshBar();
    if (G.state === 'menu') showMenu(); else if (G.state === 'pause') showPause();
    return;
  }
  const a = b.dataset.act;
  if (a === 'start') startIntro();
  else if (a === 'resume') { G.state = 'play'; hideOverlay(); }
  else if (a === 'menu') { stopAmbience(); S = null; showMenu(); }
  else if (a === 'notes') showNotes();
  else if (a === 'controls') { CTRL_BACK = G.state; showControls(); }
  else if (a === 'ctrlback') { REB = null; if (CTRL_BACK === 'pause') showPause(); else showMenu(); }
  else if (a === 'ctrlreset') { SET.bind = {}; saveSet(); rebuildKeys(); showControls(); }
  else if (a.startsWith('rebind:')) { REB = a.slice(7); showControls(); }
});

/* ============================================================
   ВВОД: клавиатура и мышь
   ============================================================ */
const KEYMAP = {
  KeyA: 'left', ArrowLeft: 'left', KeyD: 'right', ArrowRight: 'right',
  KeyW: 'up', ArrowUp: 'up', KeyS: 'down', ArrowDown: 'down',
  ShiftLeft: 'shift', ShiftRight: 'shift', KeyE: 'e'
};
const ACTS = [['up', 'Вперёд', 'KeyW'], ['down', 'Назад', 'KeyS'], ['left', 'Влево', 'KeyA'], ['right', 'Вправо', 'KeyD'], ['shift', 'Бег и затаить дыхание', 'ShiftLeft'], ['e', 'Действие (войти, обыскать, спрятаться)', 'KeyE']];
let REB = null, CTRL_BACK = 'menu';
const keyName = c => c.replace(/^Key/, '').replace(/^Digit/, '').replace(/^Shift.*/, 'Shift').replace('Arrow', 'Стрелка ').replace('Space', 'Пробел');
function rebuildKeys() {
  for (const k in KEYMAP) delete KEYMAP[k];
  Object.assign(KEYMAP, { ArrowLeft: 'left', ArrowRight: 'right', ArrowUp: 'up', ArrowDown: 'down', ShiftRight: 'shift' });
  for (const [a, , d] of ACTS) if (!SET.bind[a]) KEYMAP[d] = a;
  for (const [a] of ACTS) if (SET.bind[a]) KEYMAP[SET.bind[a]] = a;
}
rebuildKeys();
const slider = (k, label) => '<div class="row"><span>' + label + '</span><input type="range" min="0" max="100" value="' + Math.round(SET[k] * 100) + '" data-vol="' + k + '" style="width:170px;accent-color:#7a2fb0"></div>';
ov.addEventListener('input', e => {
  const k = e.target.dataset && e.target.dataset.vol; if (!k) return;
  SET[k] = e.target.value / 100; saveSet();
  if (master) master.gain.value = SET.sound ? SET.vol : 0;
  if (musG) musG.gain.value = SET.mus;
});
function showControls() {
  showOverlay('<h2>Управление</h2><p class="muted">Нажми на действие, затем на новую клавишу. Esc отменяет. Стрелки работают всегда.</p>' +
    ACTS.map(([a, n, d]) => '<div class="row"><span>' + n + '</span><button class="seg' + (REB === a ? ' on' : '') + '" data-act="rebind:' + a + '">' + (REB === a ? 'нажми клавишу…' : keyName(SET.bind[a] || d)) + '</button></div>').join('') +
    '<p class="muted">Геймпад: стик или крестовина ходьба, A действие, X или RT оружие, LB/RB выбор оружия, Y энергетик, LT бег, Start пауза, Back карта.</p>' +
    '<div class="btns"><button class="btn" data-act="ctrlback">Назад</button><button class="btn ghost" data-act="ctrlreset">Сбросить</button></div>');
}
const GP = { prev: [], held: {} };
function pollPad() {
  const p = [...(navigator.getGamepads ? navigator.getGamepads() : [])].find(x => x && x.connected);
  if (!p) return;
  const b = i => !!(p.buttons[i] && p.buttons[i].pressed), ax = i => p.axes[i] || 0, edge = i => b(i) && !GP.prev[i];
  const play = G.state === 'play';
  const dir = { left: ax(0) < -0.4 || b(14), right: ax(0) > 0.4 || b(15), up: ax(1) < -0.4 || b(12), down: ax(1) > 0.4 || b(13), shift: b(6) || b(10), e: play && b(0) };
  for (const k in dir) { if (dir[k]) { keys[k] = true; GP.held[k] = true; } else if (GP.held[k]) { keys[k] = false; GP.held[k] = false; } }
  if (play) {
    if (edge(0)) pressedE = true;
    if (edge(2) || edge(7)) pressedSpace = true;
    if (edge(3)) pressedF = true;
    if (edge(4) || edge(5)) pressedQ = 1;
    if (edge(1) && S) { if (S.shopOpen) S.shopOpen = false; else if (S.bigMap) S.bigMap = false; }
    if (edge(8)) toggleMap();
  } else if (edge(0)) {
    if (EP.on) finishEpilogue(); else if (G.state === 'intro') startGame(); else { const bt = ov.querySelector('.btn'); if (bt && !ov.classList.contains('hidden')) bt.click(); }
  }
  if (edge(9)) { if (G.state === 'intro') startGame(); else if (G.state === 'play' || G.state === 'pause') togglePause(); }
  GP.prev = p.buttons.map(x => x.pressed);
}
function tutorial() {
  const got = Object.values(S.items).filter(Boolean).length;
  const sb = (k, t, c) => { S.sb = S.sb || {}; if (!S.sb[k]) { S.sb[k] = 1; msg(t, c || '#b070ff'); } };
  if (S.elapsed > 45) sb('a', 'Где-то в тумане играет шарманка. Мелодия обрывается на полуслове.');
  if (got >= 1) sb('b', 'Вещь Ориса тёплая, словно её только что держали в руках.');
  if (S.elapsed > S.total * 0.5) sb('c', 'Половина ночи позади. На площади загорается ещё один фонарь, не твой.');
  if (got >= GOAL.length) sb('d', 'Все вещи собраны. Теперь он знает, что они у тебя.');
  if (S.elapsed > S.total * 0.85) sb('e', 'Небо на востоке едва заметно светлеет.');
  if (S.t > 6) hint('t_map', 'Нажми M: карта показывает дома и южные ворота.');
  if (S.t > 14 && !S.inside) hint('t_run', 'Shift: бег. Он быстрее, но шумный: шут слышит.');
  if (S.inside) hint('t_in', 'Подойди к мебели и удерживай E, чтобы обыскать. Шкаф и кровать: укрытие.');
  if (S.hide) hint('t_hide', 'Ты спрятался. Если шут рядом, зажми Shift и затаи дыхание.');
  if (S.pen.state === 'chase') hint('t_chase', 'Шут заметил тебя! Прячься в доме или брось приманку.');
  if (S.money >= 20) hint('t_shop', 'Есть деньги? Найди магазин и купи фонарик или оберег.');
}
window.addEventListener('keydown', e => {
  if (EP.on) { if (['Space', 'Enter', 'Escape'].includes(e.code)) { e.preventDefault(); finishEpilogue(); } return; }
  if (REB) { e.preventDefault(); if (e.code !== 'Escape') { SET.bind[REB] = e.code; saveSet(); rebuildKeys(); } REB = null; showControls(); return; }
  if (G.state === 'intro') { if (['Space', 'Enter', 'Escape'].includes(e.code)) { e.preventDefault(); startGame(); } return; }
  const k = KEYMAP[e.code];
  if (k) {
    if (G.state === 'play') e.preventDefault();
    if (k === 'e' && !e.repeat) pressedE = true;
    keys[k] = true;
  }
  if (e.code === 'Space') { if (G.state === 'play') e.preventDefault(); if (!e.repeat) pressedSpace = true; }
  if (/^Digit[1-8]$/.test(e.code) && !e.repeat) pressedDigit = +e.code.slice(5);
  if (e.code === 'KeyF' && !e.repeat) pressedF = true;
  if ((e.code === 'KeyQ' || e.code === 'Tab') && !e.repeat) { if (G.state === 'play') { e.preventDefault(); pressedQ = 1; } }
  if (e.code === 'KeyM' && !e.repeat) toggleMap();
  if (e.code === 'KeyN' && !e.repeat) toggleSound();
  if ((e.code === 'Escape' || e.code === 'KeyP') && !e.repeat) {
    if (G.state === 'play') {
      if (S && S.shopOpen) S.shopOpen = false; else if (S && S.bigMap) S.bigMap = false; else showPause();
    } else if (G.state === 'pause') { G.state = 'play'; hideOverlay(); }
  }
});
window.addEventListener('keyup', e => { const k = KEYMAP[e.code]; if (k) keys[k] = false; });
window.addEventListener('blur', () => {
  for (const k in keys) keys[k] = false;
  if (G.state === 'play') showPause();
});
document.addEventListener('visibilitychange', () => { if (document.hidden && G.state === 'play') showPause(); });

const canvasPos = e => {
  const r = cv.getBoundingClientRect();
  return { x: (e.clientX - r.left) * W / r.width, y: (e.clientY - r.top) * H / r.height };
};
const trackMouse = q => { mouse.x = q.x; mouse.y = q.y; mouse.t = performance.now(); };
cv.addEventListener('pointermove', e => trackMouse(canvasPos(e)));
cv.addEventListener('pointerdown', e => {
  if (EP.on) { finishEpilogue(); return; }
  if (G.state === 'intro') { startGame(); return; }
  if (G.state !== 'play' || !S) return;
  if (e.button !== 0) return;
  initAudio();
  e.preventDefault();
  const q = canvasPos(e);
  trackMouse(q);
  if (S.bigMap) { S.bigMap = false; return; }
  if (S.shopOpen) { shopClick(q.x, q.y); return; }
  if (inRect(q, MM)) { toggleMap(); return; }
  for (let i = 0; i < WEAPONS.length; i++) if (inRect(q, HOTBAR(i))) { S.sel = i; return; }
  if (inRect(q, CONS)) { pressedF = true; return; }
  if (S.inside) return;
  pendingAim = Math.atan2(q.y - (S.p.y - S.cam.y - 14), q.x - (S.p.x - S.cam.x));
  pressedSpace = true;
});
cv.addEventListener('contextmenu', e => e.preventDefault());
cv.addEventListener('wheel', e => {
  if (G.state === 'play' && S && !S.shopOpen) { e.preventDefault(); cycleWeapon(e.deltaY > 0 ? 1 : -1); }
}, { passive: false });

document.getElementById('bar').addEventListener('click', e => {
  const b = e.target.closest('[data-bar]');
  if (!b) return;
  initAudio();
  const a = b.dataset.bar;
  if (a === 'pause') togglePause();
  else if (a === 'map') toggleMap();
  else if (a === 'sound') toggleSound();
  else if (a === 'full') toggleFull();
});
if (!document.documentElement.requestFullscreen) { const f = document.querySelector('[data-bar="full"]'); if (f) f.style.display = 'none'; }

// масштаб под окно и плотность пикселей (чёткая картинка на больших экранах)
const stage = document.getElementById('stage');
function resize() {
  const vw = window.innerWidth, vh = window.innerHeight;
  let w = Math.min(vw - 16, (vh - 110) * W / H);
  w = Math.max(640, Math.floor(w));
  stage.style.width = w + 'px';
  const want = clamp(w * (window.devicePixelRatio || 1) / W, 1, 2.5);
  if (Math.abs(want - RS) > 0.01) setRes(want);
}
window.addEventListener('resize', resize);
resize(); refreshBar();

/* ============================================================
   ЦИКЛ
   ============================================================ */
let lastT = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - lastT) / 1000);
  lastT = now;
  pollPad();
  if (EP.on) { EP.t += dt; if (EP.t > EP_DUR) finishEpilogue(); }
  updateWeather(dt);
  if (G.state === 'intro') updateIntro(dt);
  if (G.state === 'play' && S && !S.bigMap) update(dt);   // открытая карта ставит игру на паузу
  else if (G.state === 'caught' && S) {
    S.t += dt; S.caughtT -= dt;
    if (S.caughtT <= 0) endGame(false, 'Шут поймал тебя. Бубенчики затихли над пустой улицей.');
  }
  pressedE = false; pressedSpace = false; pressedDigit = 0; pressedF = false; pressedQ = 0; pendingAim = null;
  draw();
  requestAnimationFrame(frame);
}
showMenu();
requestAnimationFrame(frame);
})();
</script>
